server:
  port: 8060

spring:
  application:
    name: cgv-portfolio
  profiles:
    default: dev
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.demo.movie.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

assistant:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}

logging:
  level:
    com.example.demo: DEBUG
    com.example.demo.movie.mapper: DEBUG
